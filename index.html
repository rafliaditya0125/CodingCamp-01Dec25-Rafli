    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

<body>

    <header id="home" class="bg-light py-5">
        <div class="container mt-4">
            <h4 id="greeting">Hi Visitor, Welcome to our website!</h4>
            <h6>Ini adalah website latihan pertama</h6>
        </div>
        <div class="container mt-1">
            <img src="images/photo banner.png" alt="Photo Banner" />
        </div>
    </header>
    <section>
        <div class="container mt-5">
            <h2>Our Facilitation</h2>
            <div class="facilitation">
                <ul>
                    <li>Professional Teacher</li>
                    <li>24/7 Customer Support</li>
                    <li>Classroom</li>
                </ul>
            </div>
        </div>
    </section>
    <section id="message" class="container mt-5">
        <h2>Message Us</h2>
        <div class="container mt-5 message">
            <form id="messageForm">
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" id="nameInput" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" id="emailInput" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Phone Number</label>
                    <input type="text" id="phoneInput" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Message</label>
                    <textarea id="messageInput" class="form-control"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <div id="resultContainer" class="container mt-2"></div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"

    <script src="js/script.js"></script>
